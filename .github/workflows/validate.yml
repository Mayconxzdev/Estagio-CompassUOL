name: Validate learning repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Python source syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          ignored = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}
          errors = []
          checked = 0

          for path in Path('.').rglob('*.py'):
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  source = path.read_text(encoding='utf-8-sig')
                  compile(source, str(path), 'exec')
                  checked += 1
              except (SyntaxError, UnicodeError) as exc:
                  errors.append(f'{path}: {exc}')

          if errors:
              for error in errors:
                  print(f'ERROR: {error}')
              raise SystemExit(1)

          print(f'Python syntax validated in {checked} files.')
          PY

      - name: Validate current repository framing
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('README.md').read_text(encoding='utf-8')
          required = [
              '10 sprints',
              'Engenharia de Dados',
              'AWS Glue',
              'PySpark',
              'Amazon Athena',
              'Amazon QuickSight',
              'Não é um ambiente empresarial de produção',
          ]
          forbidden = [
              '3h → 5min',
              '3 hours to 5 minutes',
          ]

          errors = []
          for phrase in required:
              if phrase not in text:
                  errors.append(f'missing current learning fact: {phrase}')
          for phrase in forbidden:
              if phrase in text:
                  errors.append(f'unsupported performance claim: {phrase}')

          if errors:
              for error in errors:
                  print(f'ERROR: {error}')
              raise SystemExit(1)

          print('Learning scope and non-production framing validated.')
          PY

      - name: Check obvious credential leaks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ignored = {'.git', '.venv', 'venv', 'node_modules', '__pycache__'}
          readable = {'.py', '.md', '.txt', '.json', '.yml', '.yaml', '.sh', '.sql', '.csv'}
          patterns = {
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }

          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in readable:
                  continue
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f'{path}: possible {label}')

          if findings:
              for finding in findings:
                  print(f'ERROR: {finding}')
              raise SystemExit(1)

          print('No obvious AWS access keys or private keys found in tracked text sources.')
          PY
